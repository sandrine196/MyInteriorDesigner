name: RoomVision
options:
  bundleIdPrefix: com.roomvision
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  RoomVision:
    type: application
    platform: iOS
    sources:
      - path: RoomVision
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.roomvision.app
      INFOPLIST_FILE: RoomVision/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
